name: Updater CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to republish to the Nexus update API
        required: true
        type: string
permissions:
  contents: read
env:
  HUSKY: 0

jobs:
  release-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm i

      - name: Release updater file
        run: pnpm updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          NEXUS_UPDATE_API_TOKEN: ${{ secrets.NEXUS_UPDATE_API_TOKEN }}
          NEXUS_UPDATE_API_URL: ${{ vars.NEXUS_UPDATE_API_URL }}
